[project]
name = "ai-agent-engineering"
version = "0.1.0"
description = "A hands-on LangChain, LangGraph, LangSmith, MCP, pgvector, pggraph, and Pydantic AI course, built as small, linear lessons"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-postgres>=0.0.15",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langsmith>=0.3.0",
    "mcp<2.0.0",
    "numpy>=2.5.1",
    "pandas>=2.2.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "python-dotenv>=1.2.2",
    "pydantic-ai>=2.22.0",
]

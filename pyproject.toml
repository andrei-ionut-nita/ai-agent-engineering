    "langsmith>=0.3.0",
    "mcp<2.0.0",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pandas>=2.2.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2.0",
